<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f8d7da;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: inline-block;
    }
    h1 {
      color: #721c24;
    }
    p {
      color: #721c24;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>404 - 페이지를 찾을 수 없습니다.</h1>
  <p th:text="${errorMessage}">죄송합니다. 요청하신 페이지를 찾을 수 없습니다.</p>
  <a href="/" style="color: #155724; text-decoration: none; font-weight: bold;">홈으로 돌아가기</a>
</div>
</body>
</html>
